stages:
  - verify
  - test

# GitLab (origin) is the source of truth for this repo and had NO pipeline at
# all — nothing was verified on push, and the .github/workflows/ci.yml in the
# tree only ever runs on the filtered GitHub mirror, which is populated by
# scripts/sync-github.sh rather than by pushing here.
#
# Split into two jobs on purpose. `verify` needs nothing but Node and is
# reliable on any runner. `test` additionally needs a working OS keyring,
# because keytar is a real runtime dependency — measured on a clean
# node:20-slim:
#
#   bare                                        1 failure
#   + libsecret-1-0                             25 failures
#   + libsecret + gnome-keyring + dbus session  0 failures  (237 pass)
#
# Keeping them separate means a runner without a keyring still gives you lint,
# typecheck and build rather than one opaque red pipeline.

.node_job: &node_job
  tags:
    - node
    - server7
  interruptible: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/

verify:
  <<: *node_job
  stage: verify
  script:
    - npm ci --no-audit --no-fund
    - npm run lint
    - npm run typecheck
    - npm run build

test:
  <<: *node_job
  stage: test
  script:
    - npm ci --no-audit --no-fund
    # Deliberately does NOT apt-get anything. This runner is a shell executor
    # on server7, which hosts hundreds of other sites — a CI job is not the
    # place to install system packages on a shared production box. It checks
    # instead, and tells you exactly what to provision once, by hand.
    - |
      if ! ldconfig -p 2>/dev/null | grep -q 'libsecret-1\.so'; then
        echo "libsecret is missing on this runner, and keytar needs it at runtime."
        echo "Provision it once, as an administrator:"
        echo "    sudo apt install libsecret-1-0 gnome-keyring dbus-x11"
        exit 1
      fi
    # keytar needs a Secret Service on the bus, not just the library. Running
    # under dbus-run-session with an unlocked gnome-keyring is the same thing
    # docker/test-linux.sh does for its desktop pass.
    - |
      if command -v dbus-run-session >/dev/null && command -v gnome-keyring-daemon >/dev/null; then
        dbus-run-session -- sh -c 'echo | gnome-keyring-daemon --unlock >/dev/null 2>&1; npm test'
      else
        echo "gnome-keyring / dbus-run-session not found — 25 keychain tests cannot pass without a"
        echo "Secret Service on the bus. Provision: sudo apt install gnome-keyring dbus-x11"
        exit 1
      fi
